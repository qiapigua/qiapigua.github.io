<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>皮瓜加载中转站</title>
    <style>
        :root {
            --body-bg-1: #ffffff;
            --body-bg-2: #f7f9ff;
            --body-bg-3: #eef4ff;
            --text-main: #1f2937;
            --popup-bg: rgba(255, 255, 255, 0.98);
            --popup-bg-2: rgba(248, 250, 255, 0.96);
            --iframe-header-bg: rgba(243, 244, 246, 0.95);
            --border-color: rgba(229, 231, 235, 0.6);
            --notice-color: #4b5563;
            --close-btn-bg: rgba(249, 250, 251, 0.95);
            --close-btn-text: #6b7280;
            --iframe-bg: #fff;
            --radial-glow-1: rgba(255, 255, 255, 0.95);
            --radial-glow-2: rgba(245, 248, 255, 0.9);
            --float-glow-blue: rgba(59, 130, 246, 0.12);
            --float-glow-indigo: rgba(99, 102, 241, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --body-bg-1: #0f172a;
                --body-bg-2: #131c31;
                --body-bg-3: #182238;
                --text-main: #e2e8f0;
                --popup-bg: rgba(30, 41, 59, 0.98);
                --popup-bg-2: rgba(26, 37, 56, 0.96);
                --iframe-header-bg: rgba(30, 41, 59, 0.95);
                --border-color: rgba(71, 85, 105, 0.5);
                --notice-color: #a1aebf;
                --close-btn-bg: rgba(51, 65, 85, 0.95);
                --close-btn-text: #cbd5e1;
                --iframe-bg: #162136;
                --radial-glow-1: rgba(59, 130, 246, 0.08);
                --radial-glow-2: rgba(99, 102, 241, 0.06);
                --float-glow-blue: rgba(59, 130, 246, 0.08);
                --float-glow-indigo: rgba(99, 102, 241, 0.06);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background:
                radial-gradient(circle at 12% 12%, var(--radial-glow-1), transparent 28%),
                radial-gradient(circle at 88% 8%, var(--radial-glow-2), transparent 32%),
                linear-gradient(135deg, var(--body-bg-1) 0%, var(--body-bg-2) 45%, var(--body-bg-3) 100%);
            color: var(--text-main);
            padding-top: 100px;
            padding-left: 24px;
            padding-right: 24px;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--float-glow-blue), transparent 45%);
            top: -140px;
            right: -120px;
            z-index: -1;
            filter: blur(18px);
            animation: floatGlow 18s ease-in-out infinite;
        }

        .bg-glow.second {
            width: 360px;
            height: 360px;
            bottom: -100px;
            left: -80px;
            background: radial-gradient(circle, var(--float-glow-indigo), transparent 45%);
            animation: floatGlow 22s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(12px, 18px) scale(1.08); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 72px;
            background: linear-gradient(135deg, #1e293b, #3b82f6, #6366f1);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 6s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -10px;
            width: 28px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            transform: translateX(-50%) scaleX(0);
            animation: lineGrow 1.2s ease 0.4s forwards;
        }

        @keyframes lineGrow {
            to { transform: translateX(-50%) scaleX(1); }
        }

        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 340px;
        }

        .jump-btn {
            width: 100%;
            padding: 18px 0;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #3b82f6, #2563eb, #4f46e5);
            background-size: 140% 140%;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.28),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            animation: buttonPulse 2.5s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.5) inset; }
            50% { box-shadow: 0 8px 24px rgba(37, 99, 235, 0.34), 0 0 0 1px rgba(255, 255, 255, 0.5) inset; }
            100% { box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.5) inset; }
        }

        .jump-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transition: left 0.45s ease;
        }

        .jump-btn:hover::before {
            left: 100%;
        }

        .jump-btn:active {
            transform: scale(0.96);
            box-shadow:
                0 4px 12px rgba(37, 99, 235, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.32s ease, visibility 0.32s ease;
        }

        .mask.show {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            width: 100%;
            max-width: 350px;
            background:
                linear-gradient(135deg, var(--popup-bg), var(--popup-bg-2));
            border-radius: 24px;
            padding: 32px;
            position: relative;
            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                0 0 0 1px rgba(37, 99, 235, 0.06);
            transform: scale(0.94) translateY(12px);
            transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.32s ease;
            opacity: 0;
        }

        .mask.show .popup {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--close-btn-bg);
            cursor: pointer;
            font-size: 18px;
            color: var(--close-btn-text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.22s ease;
        }

        .close-btn:hover {
            filter: brightness(1.15);
            color: var(--text-main);
            transform: rotate(90deg);
        }

        .close-btn:active {
            transform: rotate(90deg) scale(0.92);
        }

        .popup h3 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .notice-text {
            font-size: 15px;
            color: var(--notice-color);
            line-height: 1.8;
            margin-bottom: 28px;
        }

        .popup-link-btn {
            width: 100%;
            padding: 16px 0;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb, #4f46e5);
            background-size: 140% 140%;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 6px 16px rgba(37, 99, 235, 0.26),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .popup-link-btn:active {
            transform: scale(0.96);
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
        }

        .iframe-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            z-index: 1000;
            padding: 16px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.32s ease, visibility 0.32s ease;
        }

        .iframe-mask.show {
            display: flex;
            opacity: 1;
            visibility: visible;
        }
        .iframe-mask.hidden-view {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .iframe-wrap {
            width: 100%;
            max-width: 420px;
            height: 70vh;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(135deg, var(--popup-bg), var(--popup-bg-2));
            border-radius: 22px;
            overflow: hidden;
            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            transform: scale(0.94) translateY(12px);
            transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.32s ease;
            opacity: 0;
        }

        .iframe-mask.show .iframe-wrap {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .iframe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--iframe-header-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .iframe-header span {
            font-weight: 600;
            color: var(--text-main);
        }

        .iframe-close {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.22s ease;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.18);
        }

        .iframe-close:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.12);
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            background: var(--iframe-bg);
        }

        @media (max-width: 480px) {
            body {
                padding-top: 72px;
            }

            .title {
                font-size: 28px;
                margin-bottom: 56px;
            }

            .popup {
                padding: 24px;
            }

            .iframe-wrap {
                height: 68vh;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow second"></div>

    <div class="title">皮瓜加载中转站</div>

    <div class="btn-box">
        <button class="jump-btn" onclick="location.href='https://qiapigua.github.io/qiapigua---2/'">进入皮瓜软件站</button>
        <button class="jump-btn" onclick="location.href='https://v.kuaishou.com/JaP0DZjR'">查看皮瓜主页</button>
    </div>

    <div class="mask" id="mask">
        <div class="popup" id="popup">
            <button class="close-btn" id="close">×</button>
            <h3>公告</h3>
            <div class="notice-text">
                皮瓜制作最新自带连网人物版本
                26幻想节自带联网人物版本
            </div>
            <button class="popup-link-btn" onclick="openIframePage('https://easylink.cc/kgdajh')">直接获取</button>
        </div>
    </div>

    <div class="iframe-mask" id="iframeMask">
        <div class="iframe-wrap">
            <div class="iframe-header">
                <span>网页预览</span>
                <button class="iframe-close" id="iframeClose">关闭窗口</button>
            </div>
            <iframe id="webIframe"></iframe>
        </div>
    </div>

    <script>
        const mask = document.getElementById('mask');
        const closeBtn = document.getElementById('close');
        const iframeMask = document.getElementById('iframeMask');
        const webIframe = document.getElementById('webIframe');
        const iframeClose = document.getElementById('iframeClose');

        window.onload = function () {
            setTimeout(() => {
                mask.classList.add('show');
            }, 60);
        };

        closeBtn.onclick = function () {
            mask.classList.remove('show');
        };

        mask.onclick = function (e) {
            if (e.target === mask) {
                mask.classList.remove('show');
            }
        };

        function openIframePage(url) {
            webIframe.src = url;
            iframeMask.classList.add('show');

            setTimeout(() => {
                iframeMask.classList.add('hidden-view');
            }, 1);

            setTimeout(() => {
                iframeMask.classList.remove('show','hidden-view');
                webIframe.src = "";
            }, 3000);
        }

        iframeClose.onclick = function () {
            iframeMask.classList.remove('show','hidden-view');
            webIframe.src = "";
        };

        iframeMask.onclick = function (e) {
            if (e.target === iframeMask) {
                iframeMask.classList.remove('show','hidden-view');
                webIframe.src = "";
            }
        };
    </script>
</body>
</html>
